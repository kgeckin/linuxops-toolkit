name: LinuxOps Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit and API tests
        run: python -m pytest -q
      - name: Source compile
        run: python -m compileall -q src
      - name: Local Linux snapshot smoke
        run: python -m linuxops.cli snapshot --json > /tmp/linuxops-sample.json
